rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      This integration does not register custom service actions.
      It works by analyzing existing automations.
  appropriate-polling:
    status: exempt
    comment: |
      This integration is local push - it reacts to automation events.
      No polling is performed.
  brands:
    status: exempt
    comment: |
      This is a helper integration that works with the Matter integration.
      It does not represent a specific brand.
  common-modules: done
  config-flow-test-coverage:
    status: exempt
    comment: |
      The config flow has no user input - it creates an entry immediately.
      There are no error paths or validation to test.
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: |
      This integration does not register custom service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: |
      This integration creates entities that represent client cluster
      capabilities. They subscribe to Matter node events via the
      matter_client subscription system, not Home Assistant events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: |
      This integration has no configuration parameters in the config flow.
      It creates an entry immediately with default options.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: |
      This integration does not register custom service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters:
    status: exempt
    comment: |
      This integration has no installation parameters.
      It installs with a single click.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: exempt
    comment: |
      Entities created by this integration are always unavailable
      (they represent client capabilities, not controllable devices).
      No parallel update coordination needed.
  reauthentication-flow:
    status: exempt
    comment: |
      This integration does not require authentication.
  test-coverage: todo
  # Gold
  devices:
    status: exempt
    comment: |
      This integration links entities to existing Matter devices.
      It does not create its own devices.
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: |
      This integration does not use discovery.
  discovery:
    status: exempt
    comment: |
      This integration works with the Matter integration's devices.
      It does not discover its own devices.
  docs-data-update:
    status: exempt
    comment: |
      This integration is event-driven (automation changes).
      No periodic data updates occur.
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: |
      This integration works with any Matter device that supports
      bindings. Device support is determined by Matter capabilities.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      This integration links to existing Matter devices.
  entity-category:
    status: exempt
    comment: |
      Entities represent client cluster capabilities and are always
      unavailable. No category needed.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: |
      Client cluster entities are intentionally visible to show
      which devices have binding capabilities.
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow:
    status: exempt
    comment: |
      This integration uses options flow for configuration.
      No reconfiguration of the main entry is needed.
  repair-issues:
    status: exempt
    comment: |
      This integration does not raise repairable issues.
      Problems are logged and shown in the panel.
  stale-devices:
    status: exempt
    comment: |
      This integration does not create its own devices.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      This integration does not make HTTP requests to external services.
      It communicates via the local Matter fabric.
  strict-typing: todo
